name: Build

on:
  push:
    branches: [ master,dev ]
  pull_request:
    branches: [ master,dev ]

jobs:

  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore NsisoLauncher.sln
      working-directory: src

    - name: Build
      run: dotnet build NsisoLauncher.sln -c Release --no-restore
      working-directory: src

    - name: Test
      run: dotnet test NsisoLauncher.sln -c Release --no-build --no-restore
      working-directory: src

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Build Result
        path: src\NsisoLauncher\bin\Release\net10.0-windows
